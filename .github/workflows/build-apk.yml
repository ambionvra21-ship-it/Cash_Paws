name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Create the Android project files
        run: |
          flutter create --org com.cashpaws --project-name cashpaws --platforms=android .
          rm -rf test
      - name: Apply CashPaws Android settings
        run: python3 tools/configure_android.py
      - name: Raise Android build tool versions
        run: |
          python3 - <<'PY'
          import re, pathlib
          def sub(path, pat, rep):
              p = pathlib.Path(path)
              if p.exists():
                  t = p.read_text()
                  n, c = re.subn(pat, rep, t)
                  p.write_text(n)
                  print(path, 'patched' if c else 'NO MATCH')
          for f in ['android/settings.gradle', 'android/settings.gradle.kts']:
              sub(f, r'''(com\.android\.application["')\s]*version\s*["'])[\d.]+''', r'\g<1>8.6.0')
              sub(f, r'''(org\.jetbrains\.kotlin\.android["')\s]*version\s*["'])[\d.]+''', r'\g<1>1.9.24')
          sub('android/gradle/wrapper/gradle-wrapper.properties', r'gradle-[\d.]+-(all|bin)\.zip', 'gradle-8.7-all.zip')
          PY
          grep -n "com.android.application\|kotlin.android" android/settings.gradle* || true
          cat android/gradle/wrapper/gradle-wrapper.properties
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cashpaws-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CashPaws build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk

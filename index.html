<style>
:root{--bg:#f6f9fc;--card:#ffffff;--text:#14202e;--mute:#566679;--line:#d6e2ee;--accent:#0a78a8;--glow:rgba(10,120,168,.0);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#05070d;--card:#0b1220;--text:#e6f2fb;--mute:#8aa0b8;--line:#12315c;--accent:#14d1ff;--glow:rgba(20,209,255,.35)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom))}
main{max-width:680px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin:8px 0 6px}
header svg{flex:none;filter:drop-shadow(0 0 8px var(--glow))}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px}
h1{font-size:32px;line-height:1.2;margin:18px 0 4px}
.date{color:var(--mute);margin:0 0 22px;font-size:15px}
h2{font-size:20px;margin:34px 0 6px;padding-top:6px;border-top:1px solid var(--line)}
p,li{max-width:68ch}
ul{padding-left:22px}
li{margin:6px 0}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:18px 0;color:var(--mute);font-size:15px}
nav.pages{display:flex;gap:18px;margin:6px 0 0;font-size:15px}
footer{margin-top:40px;color:var(--mute);font-size:14px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
